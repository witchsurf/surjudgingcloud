name: Deploy immutable frontend to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'releases/**-frontend.tar.gz'
      - 'infra/docker-compose.yml'
      - 'deploy.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: surfjudging-production-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy signed frontend artifact
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      RELEASE_ID: surfjudging-2026.08.26-final-display-231cb1d
      RELEASE_COMMIT: 231cb1d
      ARCHIVE_NAME: surfjudging-2026.08.26-final-display-231cb1d-frontend.tar.gz
      ARCHIVE_SHA256: 391ab1095e8f18be2c92f02be0f7cae1280fafde73e0a0feb81c3a019ae6d61d

    steps:
      - name: Checkout deployment metadata and immutable artifact
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release commit and archive
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${RELEASE_COMMIT}^{commit}"
          test -f "releases/${ARCHIVE_NAME}"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "releases/${ARCHIVE_NAME}" | sha256sum -c -

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/github_actions_vps
          chmod 600 ~/.ssh/github_actions_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Stage immutable artifact and deployment files
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/github_actions_vps -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new)
          SCP=(scp -i ~/.ssh/github_actions_vps -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new)
          "${SSH[@]}" "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/judging/infra /opt/surfjudging/releases'
          "${SCP[@]}" "releases/${ARCHIVE_NAME}" "$VPS_USER@$VPS_HOST:/tmp/${ARCHIVE_NAME}"
          "${SCP[@]}" deploy.sh "$VPS_USER@$VPS_HOST:/opt/judging/deploy.sh"
          "${SCP[@]}" infra/docker-compose.yml "$VPS_USER@$VPS_HOST:/opt/judging/infra/docker-compose.yml"

      - name: Activate release atomically without build
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/github_actions_vps \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" \
            "chmod +x /opt/judging/deploy.sh && /opt/judging/deploy.sh '$RELEASE_ID' '$ARCHIVE_SHA256' '/tmp/$ARCHIVE_NAME'"

      - name: Verify public release
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 3 --retry-connrefused --retry-all-errors https://surfjudging.cloud/admin >/dev/null
          test "$(curl -fsS https://surfjudging.cloud/RELEASE_ID | tr -d '\r\n')" = "$RELEASE_ID"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/github_actions_vps
