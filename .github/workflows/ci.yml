name: CI Quality & Contract Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build Cloud Frontend
        working-directory: frontend
        run: npm run build:cloud

  test-desktop:
    name: Desktop Compatibility Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm ci

      - name: Run Desktop Test Suite
        working-directory: desktop
        run: npm test

  shell-syntax:
    name: Operational Shell Scripts Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check scripts syntax
        run: |
          for script in scripts/*.sh; do
            if [ -f "$script" ]; then
              bash -n "$script"
            fi
          done
